</button>

<p class="font-caption text-caption text-on-surface-variant">© 2024 NutriCare Hub. Secure &amp; Confidential.</p>
</footer>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const steps = document.querySelectorAll('.form-step');
            const indicators = document.querySelectorAll('.step-indicator');
            const btnNext = document.getElementById('btn-next');
            const btnBack = document.getElementById('btn-back');
            const btnSubmit = document.getElementById('btn-submit');
            const progressBar = document.getElementById('progress-bar');
            
            let currentStep = 1;
            const totalSteps = steps.length;

            function updateUI() {
                // Update Step Visibility
                steps.forEach((step, index) => {
                    if (index + 1 === currentStep) {
                        step.classList.remove('hidden');
                        // Small delay for fade in effect
                        setTimeout(() => step.classList.remove('opacity-0'), 50);
                    } else {
                        step.classList.add('opacity-0');
                        setTimeout(() => step.classList.add('hidden'), 300); // Wait for transition
                    }
                });

                // Update Indicators
                indicators.forEach((ind, index) => {
                    const stepNum = index + 1;
                    const circle = ind.querySelector('div');
                    
                    if (stepNum < currentStep) {
                        // Completed
                        circle.className = 'w-10 h-10 rounded-full bg-secondary text-on-secondary flex items-center justify-center font-label-md text-label-md mb-2 shadow-sm transition-colors duration-300';
                        circle.innerHTML = '<span class="material-symbols-outlined text-sm">check</span>';
                    } else if (stepNum === currentStep) {
                        // Active
                        circle.className = 'w-10 h-10 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center font-label-md text-label-md mb-2 shadow-sm transition-colors duration-300';
                        circle.innerHTML = stepNum;
                    } else {
                        // Future
                        circle.className = 'w-10 h-10 rounded-full bg-surface text-on-surface-variant border border-outline-variant flex items-center justify-center font-label-md text-label-md mb-2 transition-colors duration-300';
                        circle.innerHTML = stepNum;
                    }
                });

                // Update Progress Bar Width
                const progressPercentage = ((currentStep - 1) / (totalSteps - 1)) * 100;
                // Min width for visual start
                progressBar.style.width = currentStep === 1 ? '15%' : `${progressPercentage}%`;

                // Update Buttons
                if (currentStep === 1) {
                    btnBack.classList.add('hidden');
                } else {
                    btnBack.classList.remove('hidden');
                }

                if (currentStep === totalSteps) {
                    btnNext.classList.add('hidden');
                    btnSubmit.classList.remove('hidden');
                } else {
                    btnNext.classList.remove('hidden');
                    btnSubmit.classList.add('hidden');
                }
            }

            btnNext.addEventListener('click', () => {
                if (currentStep < totalSteps) {
                    currentStep++;
                    updateUI();
                }
            });

            btnBack.addEventListener('click', () => {
                if (currentStep > 1) {
                    currentStep--;
                    updateUI();
                }
            });

            document.getElementById('assessment-form').addEventListener('submit', (e) => {
                e.preventDefault();
                // Simulation of form submission
                btnSubmit.innerHTML = '<span class="material-symbols-outlined animate-spin mr-2">autorenew</span> Saving...';
                btnSubmit.classList.add('opacity-70', 'cursor-not-allowed');
                
                setTimeout(() => {
                    alert('Assessment saved successfully! Redirecting to your dashboard...');
                    btnSubmit.innerHTML = 'Complete Profile <span class="material-symbols-outlined ml-2 text-sm" data-icon="check_circle">check_circle</span>';
                    btnSubmit.classList.remove('opacity-70', 'cursor-not-allowed');
                }, 1500);
            });
            
            // Initial render
            updateUI();
        });
    </script>
</body></html>
